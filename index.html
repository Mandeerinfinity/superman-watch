<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nick's Superman Watch</title>
<meta name="description" content="Nick's Superman wristwatch: a detailed interactive watch with chronograph, timer, alarms, world time, sky data, focus mode and super powers.">
<meta name="theme-color" content="#0b1a3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Superman Watch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/oswald.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="bg"></div>
<div id="app">
  <header id="topbar">
    <div class="brand"><span id="brand-shield"></span><div><b>Nick's Superman Watch</b><small>v2 · Krypton Cal. S-38</small></div></div>
    <div id="top-clock" aria-live="off"></div>
    <nav id="tb" aria-label="Quick actions">
      <button data-act="surprise" title="Surprise me: random face, strap and scene (D)"><span>Surprise me</span></button>
      <button data-act="watchonly" title="Watch-only mode (W)"><span>Watch only</span></button>
      <button data-act="fullscreen" title="Fullscreen (Enter)"><span>Fullscreen</span></button>
      <button data-act="export" title="Export PNG (P)"><span>PNG</span></button>
      <button data-act="mute" title="Mute (M)"></button>
      <button data-act="help" title="Keyboard shortcuts (?)"></button>
      <button data-act="panel" title="Controls"></button>
    </nav>
  </header>
  <main id="stage">
    <div id="status-chips"></div>
    <div id="rig"><div id="watch" class="watch" role="img" aria-label="Superman wristwatch"></div></div>
    <div id="face-caption"><b id="cap-name"></b><span id="cap-desc"></span></div>
    <button class="btn wo-exit" data-act="exit-wo">Exit watch-only</button>
    <canvas id="fx"></canvas>
  </main>
  <aside id="panel" aria-label="Watch controls">
    <nav id="tabs"></nav>
    <div id="tab-body"></div>
  </aside>
</div>
<div id="intro" hidden></div>
<div id="modal" hidden></div>
<div id="help" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="position:fixed;top:40%;width:100%;text-align:center">Nick's Superman Watch needs JavaScript.</p></noscript>
<script src="js/util.js"></script>
<script src="js/landmask.js"></script>
<script src="js/textures.js"></script>
<script src="js/shield.js"></script>
<script src="js/audio.js"></script>
<script src="js/astro.js"></script>
<script src="js/watch.js"></script>
<script src="js/faces.js"></script>
<script src="js/backgrounds.js"></script>
<script src="js/powers.js"></script>
<script src="js/app.js"></script>
<script src="js/ui.js"></script>
<script>document.addEventListener('DOMContentLoaded', function () { SM.app.boot(); });</script>
</body>
</html>
